kind = "mobile"
previewPath = "/"
title = "Veloura"
version = "1.0.0"
id = "artifacts/veloura"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 23245

[services.development]
run = "pnpm --filter @workspace/veloura run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/veloura", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/veloura", "run", "serve" ]

[services.env]
PORT = "23245"
BASE_PATH = "/"
